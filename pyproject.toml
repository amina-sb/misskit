[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misskit"
version = "0.1.0"
description = "Missing-data diagnostics, MICE and Rubin pooling, with simulation evidence for when imputation changes the answer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "amina" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6", "ruff>=0.4", "mypy>=1.8", "pandas-stubs", "scikit-learn>=1.3", "statsmodels>=0.14"]

[project.urls]
Repository = "https://github.com/amina-sb/misskit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
misskit = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "statsmodels.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
